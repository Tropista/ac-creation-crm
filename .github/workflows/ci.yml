# CI — tests Vitest + build Vite (sans secrets Supabase/Tink)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Verification encodage
        run: npm run verify:encoding

      - name: Tests unitaires
        run: npm test

      - name: Vérification RLS Supabase
        run: node scripts/verify-rls.mjs

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Tests E2E (navigateur, mode local)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Publier rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      # Variables factices : le build passe sans .env ; Supabase reste désactivé (isSupabaseConfigured)
      - name: Build production
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key

  electron-pack:
    runs-on: windows-latest
    needs: test-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key

      # Build Electron décompressé (--dir) : vérifie le packaging sans NSIS complet
      - name: Smoke test packaging Electron
        run: npx electron-builder --win --dir --config.directories.output=release-ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier secrets Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets GitHub manquants pour deploy-vercel : ${missing[*]}. Voir README (Déploiement web / Vercel) et Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull config Vercel (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production (Vercel prebuilt)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Vérifier cohérence dist/ et index.html
        run: node scripts/verify-dist-assets.mjs dist

      - name: Déployer sur Vercel (prebuilt atomique)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
