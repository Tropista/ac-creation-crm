# CI — tests Vitest + build Vite (sans secrets Supabase/Tink)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      # Variables factices : le build passe sans .env ; Supabase reste désactivé (isSupabaseConfigured)
      - name: Build production
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
